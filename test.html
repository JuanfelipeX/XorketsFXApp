<!DOCTYPE html>
<html>
<body>

<h2>Prueba Xorkets</h2>

<script>

const ws = new WebSocket("wss://app.xorketsfx.com/api/websocket/1/all");

ws.onopen = () => {
    console.log("✅ conectado");
};

ws.onmessage = e => {
    console.log(e.data);
};

ws.onerror = e => {
    console.log("ERROR", e);
};

ws.onclose = e => {
    console.log("CLOSE", e.code);
};

</script>

</body>
</html>
